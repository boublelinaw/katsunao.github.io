<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1a14">
  <meta name="robots" content="noai, noimageai">
  <title>KatsuNao</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link id="font-link" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=Cinzel+Decorative:wght@700&family=Cinzel:wght@500;700&family=IM+Fell+English:ital@0;1&display=swap">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="is-intro">
  <!-- SVG filters: charred / burning page edges -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <filter id="burn-edge" x="-5%" y="-5%" width="110%" height="110%">
        <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="3" seed="7" result="noise">
          <animate attributeName="baseFrequency" dur="6s" values="0.035;0.042;0.035" repeatCount="indefinite"/>
        </feTurbulence>
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="14" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
      <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
        <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" seed="3" result="n"/>
        <feDisplacementMap in="SourceGraphic" in2="n" scale="8" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
    </defs>
  </svg>

  <!-- ═════════ 開場：黃昏森林 → 書 → 火 ═════════ -->
  <section id="intro" aria-label="開場動畫">
    <div class="sky"><div class="sun"></div></div>
    <div class="stars"></div>
    <div class="forest" id="forest"></div>
    <div class="night"></div>
    <div class="moon"></div>
    <div class="candles" id="candles"></div>
    <div class="clearing" id="clearing">
      <div class="magic-circle" id="magic-circle"></div>
      <div class="beam"></div>
      <div class="book-glow"></div>
      <button class="book-small" id="book-small" aria-label="拾起書本"></button>
      <p class="hint" id="hint"></p>
    </div>
    <p class="forest-quote" id="forest-quote"></p>
    <canvas id="fx"></canvas>

    <div class="book-stage" id="book-stage">
      <div class="book" id="book">
        <div class="page-under" id="page-under">
          <div class="burn-rim"></div>
          <div class="page-scroll" id="page-scroll"></div>
        </div>
        <div class="cover" id="cover">
          <div class="cover-face">
            <div class="cover-frame">
              <span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>
            </div>
            <div class="cover-crest" id="cover-crest"></div>
            <h1 class="cover-title" id="cover-title">KatsuNao</h1>
            <p class="cover-sub" id="cover-sub"></p>
            <p class="cover-quote" id="cover-quote"></p>
            <div class="counter" id="counter" aria-live="off"></div>
            <div class="cover-ornament bottom"></div>
            <button class="btn-open" id="btn-open"></button>
            <div class="clasp"><i></i></div>
          </div>
          <div class="cover-back"></div>
        </div>
      </div>
    </div>

    <button class="skip" id="skip" type="button">跳過 ›</button>
    <div class="flash" id="flash"></div>
  </section>

  <!-- ═════════ 網站本體 ═════════ -->
  <div id="app" hidden>
    <header class="topbar">
      <a class="brand" href="#/toc" id="brand">KatsuNao</a>
      <nav class="topnav">
        <a href="#/toc" class="nav-toc">目錄</a>
      </nav>
    </header>
    <main id="view" tabindex="-1"></main>
    <footer class="footer" id="footer"></footer>
    <div class="bg-sky" aria-hidden="true"></div>
    <div class="candles bg-candles" id="bg-candles" aria-hidden="true"></div>
    <canvas id="embers" aria-hidden="true"></canvas>
  </div>

  <button class="music" id="music" type="button" aria-pressed="false" aria-label="背景音樂" hidden>
    <span class="music-icon"></span><span class="music-label">音樂</span>
  </button>
  <div id="yt-holder" aria-hidden="true"></div>

  <script src="assets/vendor/marked.min.js"></script>
  <script src="assets/js/art.js"></script>
  <script src="assets/js/intro.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
