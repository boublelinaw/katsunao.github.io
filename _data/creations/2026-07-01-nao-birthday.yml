    text: "0629 · 1369 km"
  - _block: text
    body: |-
      暑氣蒸騰。

      巡邏結束後，爆豪勝己走進自家事務所，冷氣的涼風瞬間灌入黑色戰鬥服的高領內，稍微紓解六月的暑熱。近年夏天來得越來越早，他走回自己的工位坐下，雙腿豪邁地抵在桌上，現在沒有人會指點教訓他了，他可以在屬於他的天地恣意妄為。

      坐定後的第一件事是打開巡邏紀錄表，他在文件程式面前敲敲打打，鍵盤喀噠喀噠幾乎蓋過冷氣運轉的機械聲，右手抓起一旁的水壺灌著，順喉解渴的同時瞄向電腦桌面的行事曆，密密麻麻的事項和五顏六色的記號映入眼簾。

      即便迎來和平盛世，他立志於第一名英雄的信念不會允許他有太多放鬆休息的空檔，也不知道戀人是被自己影響還是怎樣，他盯著7月第一天的待辦事項，眉頭倏地皺起，像是要把那塊燒出一塊洞似的，好讓那裡空到只能塞下兩人的私人行程——既然是生日就好好休息啊？非要排在那期間回老家出差嗎？就那幾棵破樹還天天養護——當然，這句他沒有對著那個木頭笨蛋說出口。

      起初看到共用日曆上的標記時，他是一通電話直奔過去吼人，戀人的笑意順著手機的喇叭輕輕搔癢著耳廓，畢竟是老家的請求嘛－－她是這麼說的，絲毫不帶屬於自己的日子仍要工作的疲憊，回家似乎比和他一起過生日重要，是嗎？想到這，他肚子裡的怒火又燒得更旺了些。

      「勝己要去嗎？可以幫你訂機票哦。」

      「忙死了，誰有空去啊！」

      「哦……！好吧，那我先掛啦。」

      他拉開抽屜，確認放著機票的信封還在裡頭，隔著手套揉捏自己皺起的眉心，該說戀愛就是這麼一回事嗎？從訂下機票到現在，爆豪勝己都未想過此行的意義何在，單純想在她生日當天看見她？不是一年365天隨便要見都可以見嗎？

      從口袋抽出正在震動的手機，點開幾則置頂的未讀訊息，某個傢伙只要出差就會主動報備自己的行程，這點倒是不壞，從登機、下飛機了、回家啦……到她在林區內的工作自拍，一對以黃色的圓珠為主體的耳環，綠橘作為輔色點綴，在她的耳邊爍爍放光，自知道她要出差後，他原是抱著生日當天碰不著她的心情，前幾日晚上便將今年的禮物給了對方，沒想到她那麼快就戴在身上。

      爆豪已全然將自己偷懶5分鐘這種時間概念拋諸腦後。『蠢死了』、『記得喝水』、『不要以為在森林裡就不需要防曬』，把上述簡短的問候全部傳送後，手指還停駐在聊天室不肯滑開。
  - _block: chapter
    text: "0630 · 1372 km"
  - _block: text
    body: |-
      下班後的爆豪勝己會換下工作時的戰鬥服裝，身著純黑T恤和休閒褲走到商店街採買食材或日用品，慣性動作使然，他拿出手機準備敲問置頂對象想吃什麼時，再度意識到她人不在東京這件事。他停下腳步，低頭對著空氣嘖嘴，反正那傢伙也只會說都可以或烏龍麵。

      突然，一股花草的恬淡瀰漫在周圍，還以為是疲累衍伸出的幻覺，扭頭一看才發現不遠處佇立著一間花店，五顏六色的花種令人眼花撩亂，他的視線飛快鎖定了其中一盆黃色的花朵。

      向日葵……啊。

      他抬起右手，凝視著掛在腕處的手鍊，與他送給小森的耳環是成對存在的設計款，上頭的綴飾和眼前的太陽花有幾分相似。無論是飾品的寓意，抑或是花朵的隱喻，要他親口承認這份生日禮物本身所帶有的意涵，那是不可能的，他的戀人雖木訥，在這種事上卻特別機靈。爆豪將手機鏡頭對準手腕上黃綠色的閃爍，和花店前向日葵合照一張。為了傳送給誰而拍下的照片，只是看著，光是看著，耳邊就會傳來她說話的聲音。

      等待訊息回覆的時間太長了，他立即打了通電話過去，嘟嚕嘟嚕的聲響迴盪數秒，就在他準備切斷時，對面接受了來自千里之外的語音邀請。老實說，他並不喜歡電話中她的聲音，被電子設備稀釋壓縮的語調從他的喇叭中竄出，聽著就像另一個人，不是他的小森尚。

      「喂。」

      「勝己！你下班了嗎？我這邊也結束……」

      「我明天去妳那裡。」

      電話另一頭傳來蟬鳴巨響。

      「回答啊？」

      「啊……嗯！好啊，你過來吧，你再……你再傳時間給我，我去接你。」

      掛斷電話後，他搔了搔後腦勺的白金髮絲走進花店，半晌提著向日葵步入晚霞。縱然身處異地，仍共享著同一片天空，盛夏的夕陽火紅滾燙，照亮了他們各自回家的路。
  - _block: chapter
    text: "0701，655 km"
  - _block: text
    body: |-
      他的行李不多，一個行李袋就能搞定。向日葵被小心翼翼地固定在飛機座位前方的網袋中，萬千生物幾乎都離不開陽光、空氣和水，與地面被迫斷離連結的花亦是，一旦斬斷，便只能暫留數日艷麗，雖僅能擁有短暫的美，人們依舊願意將其摘下作為禮物送出。

      至少，至少得在花朵枯萎前將其送過去給她才行，此行又多了一層理由，包裹內裡不曾言說的的堅持－－他果然還是不想錯過任何關於她的日子，任何。以為訊息、電話和視訊能夠跨越距離，總歸皆不如實際見上一面還來得踏實。

      正午的炎日當空，光是步出飛機的幾分鐘便滿頭大汗。前是叢綠田野綿延而上的層巒疊嶂，後是海水投射天空無盡無窮的藍，帶著鹹味的風混著土地的氣息撲鼻而來。屋久島的機場佔地不大，一覽無遺，他一眼就能看見門口隨著海風飄逸的藍色裙襬和耳邊反射日光的珠寶閃爍。

      想念的聲響會在快見面的時候最為宏亮，並在真正相會的那一刻戛然而止。

      **10 m**，分明已經見著本人，爆豪卻沒來由地憶起前幾日共坐在沙發上的夜晚，頭上掛著毛巾、穿著睡衣的小森尚伸出食指，大膽地戳向他的髮旋，「勝己的頭髮好像盛開的向日葵」，對方隨意撇下的話語此刻正縈繞於心頭。

      他停駐在原地，等待不遠處那位還在東張西望的木頭笨蛋，快點發現他吧，他將餘剩的十米路交給對方，畢竟他已跨越千里。

      四處張望的小森尚緊握著肩背包上的背帶，隨即在撇至尖刺的白金色時落定視線，幸好她的戀人有著一頭顯眼無比的髮型，讓她能毫不費力在人群裡找到他。她笑逐顏開地朝爆豪那踏出步伐，不再是隔著話筒的悶聲，而是確實傳入耳瓣的呼喊。

      「勝己！」

      屋久島和東京那樣的大城市不同，這裡依傍山海而生，步調緩慢而自在，是她熱愛的故鄉，所以她收到請求後才會毫無猶豫地答允。她從未想過爆豪會真的放下工作千里迢迢來找自己，縱然想念，縱然覺得可惜，逐年增長的歲數和成為獨立大人的嚮往也不允許自己輕易脫口而出，只得將其繫在日日掛上的耳墜。

      但沒關係，沒關係的啊，她的太陽總會給予她那些她不敢奢望和期待的一切。

      佇立在土地上與陽相望的向日葵，終將順從趨光逐日的本能，撞進戀人熱烈溫暖的懷抱中。
