  - _block: text
    body: 畢業於雄英高中英雄科，現為職業英雄．森林神威的搭檔。個性為**木靈**，觸碰樹木後，可與樹木產生精神連結，並與之共鳴、讀取樹木的記憶，甚至能操縱樹木的生長及移動。性格為乖巧禮貌但內心戲多的森林系少女，喜歡毛茸茸的小動物和樹林。
