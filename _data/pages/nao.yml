  - _block: heading
    text: 個性
    level: h2
  - _block: note
    title: 木靈（コダマ）🪵
    tone: leaf
    body: 觸碰樹木後，可與樹木產生精神連結，並與之共鳴、讀取樹木的記憶，甚至能操縱樹木的生長及移動，但僅限木本植物（草本植物沒辦法），也無法讓完全枯萎的樹木起死回生。
  - _block: heading
    text: 應用
    level: h3
  - _block: text
    body: |-
      - 共鳴：透過與樹木共鳴鎖定敵人方向，在自然區能發揮極大的偵查作用
      - 讀取記憶：木本植物的年輪會留下樹木的記憶，在情報蒐集與線索還原中可以派上用場
      - 操縱生長/移動：主要戰鬥方式
  - _block: heading
    text: 個性使用時
    level: h3
  - _block: text
    body: |-
      - 需要極度專注
      - 因樹維網分佈於樹根，樹根之間又互相纏繞著，只要有連結觸碰到就能共鳴多棵樹木
      - 會共鳴附近的木本植物為主，如果附近沒有木本植物的話，會使用隨身攜帶的常用種子或果實
      - 若一次共鳴過多，超出精神負荷，樹木會強行斷開與她的連結，且短時間無法再次共鳴，所以在林區時，會限制自己一次最多只能共鳴5棵樹木以內
      - 如果是操作種子或樹苗，因建立根系的過程相當耗神，所以一次以2棵為上限
  - _block: heading
    text: 優／劣勢
    level: h3
  - _block: info
    rows:
      - label: 優勢
        value: 在自然區內可以發揮極大的作用，在情報搜集和戰鬥上都非常佔上風
      - label: 劣勢
        value: 高度依賴環境，且被火剋制
  - _block: heading
