  - _block: heading
    text: 家庭背景
    level: h2
  - _block: text
    body: 小森尚在鹿兒島縣的屋久島出生，家庭成員有父母和弟弟。
  - _block: info
    rows:
      - label: 父親
        value: 操縱樹木
      - label: 母親
        value: 與樹共鳴
      - label: 弟弟
        value: 腐朽生花（可以讓死去的植物起死回生）
  - _block: heading
    text: 性格、特質
    level: h2
  - _block: quote
    text: 乖巧禮貌但內心戲多的森林系少女
    cite: 一句話形容小森尚
  - _block: text
    body: |-
      **初識：乖巧、禮貌**
      時常被外人評價是有禮貌且乖巧的孩子。
      進入新環境時會有點怕生，很喜歡觀察別人。

      **熟識：話多、撒嬌**
      熟了話會變多，會不自覺地貼近喜歡、有好感的對象。

      **本質：感性、內心小劇場多**
      容易共情，淚點低，看感人影片就會泛淚的類型。
      內心的小劇場很多，時常被說感覺活在自己的森林裡。
      有時會露出冒失的一面，但在重要的事情上絕不怯場，學業成績中上。
  - _block: heading
    text: 擅長的事物
    level: h3
  - _block: text
    body: "- 小森尚的才藝：小時學過柔道、鋼琴"
  - _block: heading
    text: 不擅長的事物
    level: h3
  - _block: text
    body: |-
      - 小森的廚藝不佳，大概是煮泡麵水還會加太多的程度，但有慢慢在學習......！
      - 雖然她很喜歡辣味的香氣，但她其實不太能吃辣，最多只能吃到微辣的程度
  - _block: heading
    text: 經歷
    level: h2
  - _block: heading
    text: 幼年
    level: h3
  - _block: text
    body: |-
      4歲個性覺醒的小森尚對自己的個性得以在屋久島中穿梭自如這件事相當自滿，認為自己擁有相當強大的能力，在尚5歲時——她備受誇讚和寵愛的年紀——她的弟弟出生了。

      尚不喜歡親戚重男輕女的態度，尤其在弟弟出生後，家人不再獨寵於她，這使她無意識排斥弟弟的存在，尤其在弟弟個性覺醒時更加厭惡他。

      弟弟的個性是腐朽生花，他得以將已死去的植物轉化復甦，而正恰好是尚的個性所缺乏的部分，她無法讓植物起死回生。
  - _block: heading
    text: 初中
    level: h3
  - _block: text
    body: |-
      小學畢業後，父親為了孩子未來的發展，選擇全家搬去東京居住，城市非常不利於她的個性發展，尚得以讀取樹木的個性亦不被當時初中的同學們理解甚至排擠，雖後來在導師的介入後逐漸解決，但這件事還是在尚的心裡留下不小的陰影，甚至初中後來不再使用個性。

      直到初三決定志願時，在父親的一再開導下，尚還是選擇聽從父母的建議去報考雄英的英雄科，她認為只要她緊抓住父母對自己的期望，她仍能肯定自己是個相對優秀的存在。
  - _block: heading
    text: 進入雄英後：一年級
    level: h3
  - _block: fold
    title: 春｜雄英入學、體育祭、職場體驗
    open: false
    body: |-
      起初進入雄英的小森尚是帶著自卑的，還未從初中排擠的陰影走出，也認為自己缺少強大的意志。她害怕爆豪那樣跋扈的人，會下意識躲避他，尤其在看到他對綠谷的姿態後更加反感。

      在體育祭時，尚刻意隱瞞自己的個性組成，只有說出操縱樹木的部分。看見爆豪在體育祭的表現後，尚認為他擁有自己所缺少的、對完全勝利的追求，開始對他這個人感到好奇，但還是會害怕他的暴脾氣，所以只敢偷偷觀察他。

      直到體育祭後的職場體驗，尚被森林神威指名，森林神威發現她的觀察力簡直異如常人地好，居然可以判斷不在視線裡的敵人位置，一問之下才揭開尚個性的底牌，森林神威認為尚沒有必要掩藏自己，因為她所在的地方是雄英，雄英的學生不會在意這些。
  - _block: fold
    title: 夏｜林間合宿、英雄臨時執照考試
    open: false
    body: 在林間合宿時，在森林神威先前的開導之下，尚在樹林中展現自己個性的長處，卻在敵人聯軍前來後因共鳴過多樹木，被樹林強行斷開連結，身體不堪負荷而昏了過去，醒來後才知道爆豪被敵人抓走了。
  - _block: fold
    title: 秋｜校外實習、文化祭
    open: false
    body: （待新增）
  - _block: fold
    title: 冬｜重啟實習、離家出久
    open: false
    body: 在看見爆豪對綠谷道歉的當下，莫名想起自己對弟弟一直以來的厭惡和排斥，是否也是因為弟弟走在自己的前面——她拒絕思考，也因戰爭即將到來而無暇思考這些⋯⋯
  - _block: heading
    text: 進入雄英後：二年級
    level: h3
  - _block: fold
    title: 大戰中（二年級的五月末）
    open: false
    body: |-
      在群訝山莊舊址迎戰。

      在渡我帶來「死亡遊行」，而荼毘前來把森林整片燒毀，甚至可能引發爆炸時，尚在一片燒盡黑漆的土地上絕望地冒出：「要是我能擁有讓森林起死回生的能力⋯⋯」的強烈念頭，這才意識到自己一直以來都羨慕著弟弟，也在心裡承認了弟弟比自己厲害這件事。

      承認景仰的同時，尚也擴大超越了自己原本的共鳴範圍，只要有碰過就能共鳴生長，只要仍扎根就能操縱移動⋯⋯

      在戰末，尚幾乎快失去自我意識，被發現後急忙送往醫院。
  - _block: fold
    title: 大戰後
    open: false
    body: |-
      - 大戰的過程只持續了一天

      昏迷了5天才醒來，家人紛紛前來探望，看見年幼的弟弟眼眶裡含著淚水，她也忍不住向弟弟哭著為一直以來排斥他的事情道歉，並告訴弟弟：「你未來一定能成為比姊姊厲害很多的人。」作為她對這份課題的釋懷和放下。

      戰後的復原工作主要負責植栽。
  - _block: heading
    text: 畢業後成年：約25歲
    level: h3
  - _block: text
    body: |-
      目前是森林神威的搭檔，故無參與排名，但森林神威如今仍在榜上前十內（加筆為 No.4），也有小森尚在一旁協助的功勞。

      會和麗日等人一起進行個性諮詢擴張計畫，有在考慮要不要以個人名義獨立。

      平時的工作除了和前輩一起處理案件、麗日的個性諮詢外，多半是自然區的維護等，放假有空會回老家屋久島爬爬山。

      弟弟自雄英高中普通科畢業後考上大學，主要做植物學的研究，立志研發出更方便尚在實戰中使用的特化種子。

      爆豪自成立事務所後，似乎希望小森去他那裡做他的搭檔，然後就被小森婉拒了，一方面他們的個性實在不適合待在一個事務所裡，另一方面，她覺得工作和愛情要分開，和爆豪一起工作會不專心。（尚的內心OS：其實是覺得在勝己那裡工作應該會很高壓啦……哈哈……）
  - _block: heading
    text: 與原作角色的關係
    level: h2
  - _block: heading
    text: 爆豪勝己
    level: h3
  - _block: quote
    text: 厭惡、在意 → 欣賞、戀慕
    cite: ""
  - _block: text
    body: |-
      因為初中的陰影，起初很討厭爆豪這個人，卻在體育祭看見他強烈的好勝心，進而對他產生好奇，並開始默默觀察他。

      在他對綠谷道歉後正式對他改觀，並在戰後渴望和他變得更加熟稔⋯⋯
  - _block: heading
    text: 麗日御茶子
    level: h3
  - _block: quote
    text: 小森在雄英裡要好的朋友！
    cite: ""
  - _block: text
    body: |-
      喜歡麗日的溫暖和笑容，忍不住讓小森有「好想保護她的溫暖」的念頭。

      第一個知道小森喜歡爆豪的女生朋友，在一旁聽小森說很多戀愛少女的碎唸故事。
  - _block: heading
    text: 切島銳兒郎
    level: h3
  - _block: quote
    text: 和誰都能相處得很好的人⋯⋯？
    cite: ""
  - _block: text
    body: 戰後不知道要怎麼親近爆豪時，曾對切島說過：「好羨慕你跟爆豪君能處得很好。」被切島笑著拍拍肩膀說：「像個男子漢直接衝過去搭話就好啦！不要怕！」
  - _block: chat
    title: ""
    collapsed: false
    messages:
      - side: right
        name: 小森
        avatar: ""
        text: 我不是男生啦⋯⋯
      - side: left
        name: 切島
        avatar: ""
        text: 我知道啦！比喻而已！比喻！
  - _block: heading
    text: 森林神威
    level: h3
  - _block: quote
    text: 提拔、鼓舞小森的英雄前輩
    cite: ""
  - _block: text
    body: |-
      森林神威對小森的處事能力向來放心，她是有天賦的孩子，許多事情教一遍就會通，明白她的瓶頸在於內心的雜念，會在她迷茫時給予意見指導。

      當他發現她正在和同班的爆豪同學交往時，先是愣了許久，才開口問：「⋯⋯什麼時候的事？」似乎沒辦法想像她會和那樣的人在一起，但也不敢評價太多。
