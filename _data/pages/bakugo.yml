    text: 畢業後成年：約25歲
    level: h3
  - _block: text
    body: |-
      畢業後加入Best Jeanist 的事務所成為搭檔，隨後獨立。實力與百萬同等甚至被評價在其之上，但言行粗暴的壞習慣一直沒改，導致排名難以提升。與他人組隊時，評價會不可思議地上升！？深受前輩英雄們的疼愛。

      英雄排名：No.4（初登場）→ No.15 → No.5
