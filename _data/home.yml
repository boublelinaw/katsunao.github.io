worldview_title: 世界觀
worldview:
  - _block: heading
    text: 超人社會、個性
    level: h2
  - _block: text
    body: |-
      距今100多年前，中國輕慶市的某家醫院出現一個會發光的新生嬰兒，其後，各地都發現了超常現象，人們身上開始發現特異體質，而那些體質不知何時被稱為「個性」。不過這種「超常」導致犯罪案件增加，甚至演變成國家無法全盤處理的狀況，人們之中陸續出現為了對抗惡意而行動的人。他們做出漫畫情節般的英雄行動，在惡意中守護人民。

      如今，世界總人口約八成都擁有某種「特異體質」，社會成了超人社會，在輿論的推波助瀾下，職業英雄成為公定職業，類似特殊公務員，在警察請求支援時出動，負責保護人民，依照活躍程度，有國家給與的收入和人們給與的名聲。
  - _block: heading
    text: 雄英高中
    level: h2
  - _block: text
    body: 位於靜岡縣的名門英雄培育學校，曾培育出歐爾麥特等傳奇英雄。設有英雄科、普通科、經營科與後勤科。入學考試極其嚴苛，除了筆試外，還須透過對抗訓練機器的術科考試來審查考生的戰鬥能力與英雄資質。自神野事件後全面實施住宿制。
